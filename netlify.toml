[build]
  publish = "public"
  # If you have a frontend build, set it here, e.g.
  # command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route all /api/* to the Express app inside the "api" function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
